---
name: s3_slstr_l2_lst
description: "Sentinel-3 LST"
metadata_type: eo3
license: CC-BY-4.0

metadata:
  product:
    name: s3_slstr_l2_lst
storage:
  crs: 'EPSG:4326'
  resolution:
    longitude: 0.003
    latitude: -0.003
measurements:
  - name: "LST"
    aliases: [Land_surface_temperature]
    dtype: uint16
    nodata: 65535
    units: "K"
    scale_factor: 0.01
    add_offset: 0.0
  - name: "LST_uncertainty"
    aliases: [Land_surface_temperature_uncertainty]
    dtype: uint16
    nodata: 65535
    units: "K"
    scale_factor: 0.01
    add_offset: 0.0
  - name: "NDVI"
    dtype: int16
    nodata: 32767
    units: "1"
    scale_factor: 0.0001
    add_offset: 0.0
  - name: CONFIDENCE
    dtype: uint16
    units: '1'
    nodata: 65535
    aliases: [mask]
    flags_definition:
      coastline:
        bits: 0
        values: {0: false, 1: true}
        description: Coastline
      ocean:
        bits: 1
        values: {0: false, 1: true}
        description: Ocean
      tidal:
        bits: 2
        values: {0: false, 1: true}
        description: Tidal
      land:
        bits: 3
        values: {0: false, 1: true}
        description: Land
      inland_water:
        bits: 4
        values: {0: false, 1: true}
        description: Inland water
      unfilled:
        bits: 5
        values: {0: false, 1: true}
        description: Unfilled
      cosmetic:
        bits: 8
        values: {0: false, 1: true}
        description: Cosmetic defect
      duplicate:
        bits: 9
        values: {0: false, 1: true}
        description: Duplicate
      day:
        bits: 10
        values: {0: false, 1: true}
        description: Day
      twilight:
        bits: 11
        values: {0: false, 1: true}
        description: Twilight
      sun_glint:
        bits: 12
        values: {0: false, 1: true}
        description: Sun glint
      snow:
        bits: 13
        values: {0: false, 1: true}
        description: Snow
      summary_cloud:
        bits: 14
        values: {0: false, 1: true}
        description: Summary cloud
      summary_pointing:
        bits: 15
        values: {0: false, 1: true}
        description: Summary pointing
