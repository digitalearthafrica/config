---
name: s1_monthly_mosaic
description: "Monthly Sentinel-1 mosaics of weighted terrain-corrected
  backscatter."
metadata_type: eo3
license: Copernicus

metadata:
  product:
    name: s1_monthly_mosaic

storage:
  crs: EPSG:4326
  resolution:
    longitude: 0.0002
    latitude: -0.0002

measurements:
  - name: "VV"
    aliases: [vv]
    dtype: float32
    nodata: NaN
    units: "1"
  - name: "VH"
    aliases: [vh]
    dtype: float32
    nodata: NaN
    units: "1"
